<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Radiant Metallic Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <radialGradient id="goldPupil" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>
  </defs>

  <!-- Top Diamond Crest -->
  <polygon points="16,0.5 19,4 16,7.5 13,4" fill="url(#gold)" />
  <polygon points="16,1.8 17.8,4 16,6.2 14.2,4" fill="#071927" />

  <!-- Bottom Diamond Crest -->
  <polygon points="16,31.5 19,28 16,24.5 13,28" fill="url(#gold)" />
  <polygon points="16,30.2 17.8,28 16,25.8 14.2,28" fill="#071927" />

  <!-- Outer Eye Stroke (Bold Gold) -->
  <path d="M 1.5,16 C 5.5,7.5 26.5,7.5 30.5,16 C 26.5,24.5 5.5,24.5 1.5,16 Z" 
        fill="#FFFFFF" 
        stroke="url(#gold)" 
        stroke-width="2.2" 
        stroke-linejoin="round" />

  <!-- Inner Navy Eyelid Trim -->
  <path d="M 3.5,16 C 7.5,9.5 24.5,9.5 28.5,16 C 24.5,22.5 7.5,22.5 3.5,16 Z" 
        fill="#FFFFFF" 
        stroke="#071927" 
        stroke-width="1.2" />

  <!-- Center Circular Iris (Deep Navy) -->
  <circle cx="16" cy="16" r="6.2" fill="#071927" stroke="url(#gold)" stroke-width="1.2" />

  <!-- Radiating Iris Rays (Bold 8-spoke star) -->
  <g stroke="url(#gold)" stroke-width="0.9" stroke-linecap="round">
    <line x1="16" y1="10.4" x2="16" y2="12" />
    <line x1="16" y1="20" x2="16" y2="21.6" />
    <line x1="10.4" y1="16" x2="12" y2="16" />
    <line x1="20" y1="16" x2="21.6" y2="16" />
    <line x1="12" y1="12" x2="13.2" y2="13.2" />
    <line x1="18.8" y1="18.8" x2="20" y2="20" />
    <line x1="12" y1="20" x2="13.2" y2="18.8" />
    <line x1="18.8" y1="13.2" x2="20" y2="12" />
  </g>

  <!-- Glowing Golden Pupil -->
  <circle cx="16" cy="16" r="3" fill="url(#goldPupil)" stroke="#78350F" stroke-width="0.5" />
  
  <!-- Catchlight Reflection -->
  <circle cx="15" cy="15" r="0.9" fill="#FFFFFF" />
</svg>
